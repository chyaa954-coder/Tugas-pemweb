<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Pribadi Saya</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #d5eaff, #f4fbff, #c9e3ff);
    color: #10458d;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Hiasan latar belakang */
.decoration {
    position: fixed;
    z-index: 0;
    color: #8dbcf5;
    opacity: 0.55;
    font-size: 150px;
    pointer-events: none;
}

.decoration.left {
    left: -35px;
    top: 180px;
}

.decoration.right {
    right: -30px;
    bottom: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 25px 25px 45px;
    text-align: center;
    position: relative;
    z-index: 1;
}

.greeting {
    font-size: clamp(20px, 4vw, 30px);
    letter-spacing: 7px;
    font-weight: bold;
    margin-bottom: 22px;
}

.profile {
    width: 220px;
    height: 220px;
    margin: 0 auto 22px;
    border: 7px solid #1765bb;
    outline: 3px solid #a8d1ff;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 10px 25px #164c8c35;
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

h1 {
    font-family: Georgia, serif;
    font-size: clamp(30px, 6vw, 44px);
    line-height: 1.2;
    margin: 18px 0 12px;
    color: #10458d;
}

.subtitle {
    font-size: clamp(16px, 3.5vw, 22px);
    margin: 12px 0 22px;
    line-height: 1.5;
}

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin: 15px 0 30px;
    font-size: 43px;
    color: #1765bb;
}

.divider span {
    width: 100px;
    height: 2px;
    background: #397ec9;
}

/* Daftar menu */
.menu {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.menu a {
    display: flex;
    align-items: center;
    min-height: 83px;
    padding: 10px 23px;
    border-radius: 60px;
    text-decoration: none;
    color: white;
    background: linear-gradient(110deg, #10458d, #246ac0);
    border: 5px solid #a9d2ff;
    box-shadow:
        0 5px 0 #72a9e6,
        0 10px 18px #1b57952b;
    transition: transform 0.2s, background 0.2s;
}

.menu a:hover {
    transform: translateY(-3px);
    background: linear-gradient(110deg, #1d5ca9, #3884d8);
}

.menu-icon {
    width: 58px;
    height: 58px;
    min-width: 58px;
    border-radius: 50%;
    background: #e6f3ff;
    color: #10458d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 29px;
}

.menu-text {
    flex: 1;
    text-align: left;
    margin-left: 22px;
    font-size: clamp(14px, 2.8vw, 20px);
    font-weight: bold;
    letter-spacing: 2px;
}

.arrow {
    font-size: 32px;
    font-weight: bold;
    margin-left: 8px;
}

/* Tampilan HP */
@media (max-width: 480px) {
    .container {
        padding: 30px 18px 40px;
    }

    .greeting {
        letter-spacing: 4px;
        margin-bottom: 25px;
    }

    .profile {
        width: 180px;
        height: 180px;
    }

    h1 {
        font-size: 34px;
    }

    .divider {
        gap: 20px;
        margin-bottom: 27px;
    }

    .divider span {
        width: 65px;
    }

    .menu {
        gap: 14px;
    }

    .menu a {
        min-height: 77px;
        padding: 8px 14px;
        border-width: 4px;
    }

    .menu-icon {
        width: 52px;
        height: 52px;
        min-width: 52px;
        font-size: 26px;
    }

    .menu-text {
        margin-left: 15px;
        letter-spacing: 1px;
    }

    .arrow {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="decoration left">❦</div>
<div class="decoration right">❦</div>

<main class="container">

    <p class="greeting">❧ HALO SEMUANYA! ❧</p>

    <div class="profile">
        <img src="foto.jpg" alt="Foto profil saya">
    </div>

    <h1>Selamat Datang Di Web Saya</h1>

    <p class="subtitle">
        ❀ Mengenal lebih dekat tentang saya ❀
    </p>

    <div class="divider">
        <span></span>
        ♡
        <span></span>
    </div>

    <nav class="menu">

        <a href="profile.html">
            <span class="menu-icon">♙</span>
            <span class="menu-text">MY PROFILE</span>
            <span class="arrow">›</span>
        </a>

        <a href="about.html">
            <span class="menu-icon">♡</span>
            <span class="menu-text">ABOUT ME</span>
            <span class="arrow">›</span>
        </a>

        <a href="hobbies.html">
            <span class="menu-icon">✿</span>
            <span class="menu-text">MY HOBBIES</span>
            <span class="arrow">›</span>
        </a>

        <a href="education.html">
            <span class="menu-icon">♧</span>
            <span class="menu-text">EDUCATION</span>
            <span class="arrow">›</span>
        </a>

        <a href="schedule.html">
            <span class="menu-icon">▦</span>
            <span class="menu-text">CLASS SCHEDULE</span>
            <span class="arrow">›</span>
        </a>

        <a href="table1.html">
            <span class="menu-icon">▤</span>
            <span class="menu-text">TABLE 1</span>
            <span class="arrow">›</span>
        </a>

        <a href="table2.html">
            <span class="menu-icon">▤</span>
            <span class="menu-text">TABLE 2</span>
            <span class="arrow">›</span>
        </a>

        <a href="table3.html">
            <span class="menu-icon">▤</span>
            <span class="menu-text">TABLE 3</span>
            <span class="arrow">›</span>
        </a>

    </nav>

</main>

</body>
</html>
