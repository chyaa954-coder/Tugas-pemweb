<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #a3a3a3;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            background-color: #a3a3a3;
            border: 1px solid #000000;
            width: min(100%, 400px);
            padding: 20px;
            box-sizing: border-box;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .inline-label {
            display: inline;
            font-weight: normal;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 6px;
        }
        textarea {
            height: 80px;
            resize: none;
        }
        .buttons {
            margin-top: 15px;
        }
        .buttons button {
            padding: 4px 10px;
            margin-right: 5px;
            cursor: pointer;
        }
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 style="margin-top: 0; margin-bottom: 15px;">Formulir Pendaftaran</h2>
        
        <form>
            <!-- Nama Lengkap -->
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" placeholder="Masukkan nama">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="nama@gmail.com">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password">
            </div>

            <!-- Umur -->
            <div class="form-group">
                <label for="umur">Umur:</label>
                <input type="number" id="umur">
            </div>

            <!-- Tanggal Lahir -->
            <div class="form-group">
                <label for="tanggal_lahir">Tanggal Lahir:</label>
                <input type="date" id="tanggal_lahir">
            </div>

            <!-- Jenis Kelamin (Radio Button) -->
            <div class="form-group">
                <label>Jenis Kelamin:</label>
                <input type="radio" id="laki" name="gender" value="Laki-laki">
                <label for="laki" class="inline-label">Laki-laki</label><br>
                <input type="radio" id="perempuan" name="gender" value="Perempuan">
                <label for="perempuan" class="inline-label">Perempuan</label>
            </div>

            <!-- Hobi (Checkbox) -->
            <div class="form-group">
                <label>Hobi:</label>
                <input type="checkbox" id="coding" value="Coding">
                <label for="coding" class="inline-label">Coding</label><br>
                <input type="checkbox" id="gaming" value="Gaming">
                <label for="gaming" class="inline-label">Gaming</label><br>
                <input type="checkbox" id="olahraga" value="Olahraga">
                <label for="olahraga" class="inline-label">Olahraga</label>
            </div>

            <!-- Jurusan (Dropdown) -->
            <div class="form-group">
                <label for="jurusan">Jurusan:</label>
                <select id="jurusan">
                    <option value="">Pilih jurusan...</option>
                    <option value="RPL">Rekayasa Perangkat Lunak</option>
                    <option value="TKJ">Teknik Komputer & Jaringan</option>
                </select>
            </div>

            <!-- Alamat -->
            <div class="form-group">
                <label for="alamat">Alamat:</label>
                <textarea id="alamat" placeholder="Masukkan alamat"></textarea>
            </div>

            <!-- Foto (File Upload) -->
            <div class="form-group">
                <label for="foto">Foto:</label>
                <input type="file" id="foto">
            </div>

            <!-- Website -->
            <div class="form-group">
                <label for="website">Website:</label>
                <input type="url" id="website" placeholder="https://website.com">
            </div>

            <!-- Tombol Aksi -->
            <div class="buttons">
                <button type="submit">Kirim</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>

</body>
</html>
