<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobi Saya</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #a3a3a3; /* Warna latar belakang luar */
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background-color: #a3a3a3; /* Menyamakan warna kotak dalam */
            border: 1px solid #000000;
            width: 300px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1, h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        p {
            margin-bottom: 10px;
        }
        ul, ol {
            margin-top: 0;
            padding-left: 25px;
        }
        li {
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hobi</h1>
        <p>Beberapa hobi saya adalah:</p>
        <ul>
            <li>Membaca</li>
            <li>Olahraga</li>
            <li>Bermain game</li>
            <li>Fotografi</li>
        </ul>

        <h2>Urutan Hobi Favorit</h2>
        <ol type="A">
            <li>Programming</li>
            <li>Gaming</li>
            <li>Badminton</li>
            <li>Traveling</li>
        </ol>
    </div>

</body>
</html>
