<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Pribadi Saya</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #d5edff, #f4faff, #d3eaff);
    color: #10458d;
    min-height: 100vh;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 25px 22px 45px;
    text-align: center;
    position: relative;
    z-index: 1;
}

/* Hiasan hewan lucu */
.animal {
    position: fixed;
    z-index: 0;
    font-size: clamp(45px, 10vw, 95px);
    opacity: 0.9;
    pointer-events: none;
}

.cat {
    top: 25px;
    left: -12px;
}

.chick {
    top: 90px;
    right: -8px;
}

.bear {
    bottom: 20px;
    left: -15px;
}

.penguin {
    bottom: 20px;
    right: -12px;
}

.cloud {
    position: fixed;
    z-index: 0;
    font-size: 100px;
    color: #9ccfff;
    opacity: 0.45;
    pointer-events: none;
}

.cloud-left {
    bottom: 5px;
    left: -30px;
}

.cloud-right {
    top: 180px;
    right: -35px;
}

/* Judul */
.greeting {
    font-size: clamp(20px, 4vw, 30px);
    letter-spacing: 5px;
    font-weight: bold;
    margin-bottom: 22px;
}

.profile {
    width: 210px;
    height: 210px;
    margin: 0 auto 20px;
    border: 7px solid #1765c0;
    outline: 3px solid #a6d4ff;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 8px 20px #2868a638;
    background: white;
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

h1 {
    font-family: Georgia, serif;
    font-size: clamp(30px, 6vw, 43px);
    line-height: 1.2;
    margin: 18px 0 12px;
    color: #10458d;
}

.subtitle {
    font-size: clamp(16px, 3.5vw, 21px);
    line-height: 1.6;
    margin-bottom: 20px;
}

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    font-size: 40px;
    margin: 12px 0 28px;
}

.divider span {
    width: 100px;
    height: 3px;
    background: #377ecb;
}

/* Tombol menu */
.menu {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.menu a {
    display: flex;
    align-items: center;
    min-height: 84px;
    padding: 10px 22px;
    border-radius: 60px;
    text-decoration: none;
    color: white;
    background: linear-gradient(110deg, #0752b4, #2879d7);
    border: 5px solid #a6d4ff;
    box-shadow:
        0 4px 0 #6ca8e9,
        0 8px 18px #2865a82c;
    transition: 0.25s;
}

.menu a:hover {
    transform: translateY(-3px);
    background: linear-gradient(110deg, #1769c8, #4697ec);
}

.menu-icon {
    width: 58px;
    height: 58px;
    min-width: 58px;
    border-radius: 50%;
    background: #e7f4ff;
    color: #10458d;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 29px;
}

.menu-text {
    flex: 1;
    text-align: left;
    margin-left: 22px;
    font-size: clamp(13px, 2.8vw, 19px);
    font-weight: bold;
    letter-spacing: 1.5px;
}

.arrow {
    font-size: 32px;
    font-weight: bold;
    margin-left: 8px;
}

/* Hiasan kecil */
.paw {
    position: fixed;
    z-index: 0;
    color: #5ca5f4;
    font-size: 38px;
    opacity: 0.7;
    pointer-events: none;
}

.paw-one {
    top: 35%;
    left: 5%;
}

.paw-two {
    top: 45%;
    right: 5%;
}

.paw-three {
    bottom: 28%;
    left: 5%;
}

.paw-four {
    bottom: 30%;
    right: 5%;
}

.heart {
    position: fixed;
    z-index: 0;
    color: #428de8;
    font-size: 40px;
    opacity: 0.75;
    pointer-events: none;
}

.heart-one {
    top: 28%;
    left: 3%;
}

.heart-two {
    top: 40%;
    right: 3%;
}

/* Tampilan HP */
@media (max-width: 480px) {
    .container {
        padding: 28px 17px 40px;
    }

    .greeting {
        letter-spacing: 3px;
        margin-bottom: 22px;
    }

    .profile {
        width: 175px;
        height: 175px;
    }

    h1 {
        font-size: 33px;
    }

    .subtitle {
        font-size: 16px;
    }

    .divider {
        gap: 18px;
        margin-bottom: 25px;
    }

    .divider span {
        width: 65px;
    }

    .menu {
        gap: 13px;
    }

    .menu a {
        min-height: 76px;
        padding: 8px 13px;
        border-width: 4px;
    }

    .menu-icon {
        width: 52px;
        height: 52px;
        min-width: 52px;
        font-size: 25px;
    }

    .menu-text {
        margin-left: 14px;
        letter-spacing: 1px;
    }

    .arrow {
        font-size: 27px;
    }

    .animal {
        font-size: 48px;
    }
}
</style>
</head>
