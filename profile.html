<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile.html</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #a3a3a3; /* Latar belakang abu-abu luar */
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: #a3a3a3; /* Menyamakan warna latar belakang dalam */
            border: 1px solid #000000;
            width: 550px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1, h2 {
            margin-top: 0;
            margin-bottom: 15px;
        }
        .profile-img {
            width: 150px;
            height: auto;
            display: block;
            margin-bottom: 20px;
        }
        p {
            margin-top: 0;
            margin-bottom: 12px;
            line-height: 1.4;
            font-size: 15px;
        }
        mark {
            background-color: #ffff00; /* Warna stabilo kuning */
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Profil Mahasiswa</h1>
        
        <!-- Ganti 'foto-profil.jpg' dengan file gambar Anda sendiri -->
        <img src="foto.jpeg" alt="Foto Profil" class="profile-img">

        <h2>Data Diri</h2>
        
        <p>Nama saya <strong>Varissa Cahaya Sri Mulyani</strong>. Saya adalah mahasiswa <em>Sistem Informasi</em>.</p>
        
        <p>Saya sedang mempelajari <em> HTML, CSS, dan JavaScript</em>.</p>
        
        <p>Target saya adalah menjadi .... misal <mark>(Web Developer)</mark>.</p>
    </div>

</body>
</html>
